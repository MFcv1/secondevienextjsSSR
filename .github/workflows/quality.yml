name: Next quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix functions
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm security:audit
      - run: pnpm lint
      - run: pnpm lint:functions
      - run: pnpm test:commerce
      - run: pnpm test:catalog
      - run: pnpm test:auth
      - run: pnpm test:support-privacy
      - run: pnpm test:release-contract
      - run: pnpm test:a11y
      - run: pnpm test:quotes
      - run: pnpm test:newsletter
      - run: pnpm appcheck:audit
      - run: pnpm test:analytics
      - run: pnpm test:retention
      - run: pnpm test:billing-onboarding
      - run: pnpm test:invoices
      - run: pnpm test:admin-cache
      - run: pnpm test:meta
      - run: pnpm test:deployment-cache
      - run: pnpm seo:surface
      - run: pnpm build
        env:
          CATALOG_BUILD_FIXTURE: "true"
      - run: pnpm security:audit:bundle
      - run: pnpm seo:origin
      - run: pnpm next:routes
      - name: Performance budget report
        continue-on-error: true
        run: pnpm perf:budget

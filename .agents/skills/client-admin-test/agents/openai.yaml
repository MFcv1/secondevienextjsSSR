  short_description: "Recette sandbox autonome client et admin"
  default_prompt: "Utilise $client-admin-test et exécute toi-même toute la recette sandbox en pleine autonomie avec Chrome externe. J’autorise, uniquement pour cette campagne, le contrôle de Seconde Vie et Gmail, le changement via l’icône Google entre matthis.fradin2@gmail.com, pvml7008@gmail.com et loa.gto15@gmail.com, la lecture et la saisie non exposée des OTP de recette, les coordonnées et images fictives, ainsi que les publications, paiements et remboursements Stripe test bornés. Ne me demande pas de me connecter, de changer un compte, d’ouvrir Gmail ou de saisir un OTP lorsque ces actions sont accessibles à l’agent ; suspends seulement devant une protection humaine réellement non automatisable ou une approbation imposée par la plateforme. Accomplis M01–M13 et tous les parcours client/admin. Chaque succès intermédiaire est un checkpoint : raisonne sur les dépendances et poursuis la meilleure prochaine action sûre jusqu’à la définition de fin. Ne ferme pas la fenêtre après les seuls paiements si des mutations du run restent à exécuter ; une fermeture de sécurité anticipée ne vaut jamais fin de campagne. Adapte-toi aux frictions ordinaires, poursuis tous les scénarios indépendants et consigne chaque anomalie applicative dans anomalies.md sans corriger le code."


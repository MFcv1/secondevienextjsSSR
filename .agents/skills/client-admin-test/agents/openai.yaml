interface:
  display_name: "Test client / admin"
  short_description: "Recette sandbox autonome client et admin"
  default_prompt: "Utilise $client-admin-test et confie toute la campagne à un unique `gpt-5.6-terra` en raisonnement élevé avec un contexte autonome si l’exécuteur n’est pas déjà marqué Terra; le parent ne contrôle jamais Chrome et reprend toujours le même Terra. J’autorise, pour cette recette sandbox uniquement, le contrôle de Chrome sur Seconde Vie et Gmail, la lecture des e-mails de recette de pvml7008@gmail.com et loa.gto15@gmail.com, la sélection de ces comptes Google déjà connectés, la connexion Google OAuth administrateur, la lecture puis la saisie des OTP Seconde Vie sans exposition, la saisie des coordonnées fictives de recette dans le checkout, le téléversement d’images de recette sans donnée personnelle vers l’administration sandbox, ainsi que les publications, paiements et remboursements Stripe test bornés. Exécute M01–M13 de bout en bout avec le skill Chrome externe, le runId `run_v2all_*`, la découverte autonome des cinq produits et exactement deux commandes. Les statuts `CORRIGEE_A_REQUALIFIER`, notamment A-017, A-018 et A-019, imposent leur requalification et ne bloquent jamais à eux seuls la campagne; lance leurs gates actuelles et ne suspends que le sous-parcours réellement rouge. M01 n’est pas la Gate P0: si l’échange Firebase Auth échoue après validation OTP, réutilise la reprise bornée du même jeton, poursuis M02 jusqu’au paiement sans payer, puis requalifie M01 avant de compléter P1. Diagnostique uniquement les onglets visibles de l’instance Chrome reliée, protège strictement les OTP et résultats Gmail bruts, récupère les blocages transitoires, poursuis les scénarios indépendants, n’écris les anomalies que dans anomalies.md, ne crée aucun autre Markdown, ne corrige aucun code et réserve toute implémentation à Sol."

policy:
  allow_implicit_invocation: true
